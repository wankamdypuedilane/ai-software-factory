[project]
name = "ai-software-factory"
version = "0.1.0"
description = "Reusable AI-assisted software development factory"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "python-dotenv>=1.0"
]

[project.scripts]
ai-factory = "ai_factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "ai_factory",
    "ai_factory._data.agents",
    "ai_factory._data.templates",
]

[tool.setuptools.package-dir]
"" = "src"
"ai_factory._data.agents" = "agents"
"ai_factory._data.templates" = "templates"

[tool.setuptools.package-data]
"ai_factory._data.agents" = ["**/*.md"]
"ai_factory._data.templates" = ["**/*.yaml", "**/*.md"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
